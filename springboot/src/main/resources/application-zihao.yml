server:
  port: 8008
  tomcat:
    uri-encoding: UTF-8

tcp:
  server:
    port: 60000

spring:
  profiles:
    active: share
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  application:
    name: community-service
  redis:
    database: 6
    host: 220.190.10.25
    port: 6379
    password: 123456
    pool:
      max-active: 300
      max-wait: 10000
      max-idle: 100
      min-idle: 0
      timeout: 0
  activiti:
    database-schema-update: false

feign:
  client:
    config:
      default:
        connect-timeout: 10000
        read-timeout: 20000

